<!doctype html><html lang="pl"><head><meta charset="utf-8"><script src="../../storage52.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stan padaczkowy SOR</title><link rel="stylesheet" href="style.css"></head>
<body><div id="startDisc" role="dialog" aria-modal="true" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(31,58,95,.35);align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:20px;padding:22px;max-width:420px;box-shadow:0 8px 30px rgba(31,58,95,.4);border-top:6px solid #1f3a5f;text-align:center;color:#2b2f36"><div style="font-size:19px;font-weight:800;line-height:1.4;margin-bottom:18px">Narzędzie pomocnicze, niecertyfikowane. Każdą dawkę i decyzję weryfikuje lekarz.</div><button id="startDiscOk" style="width:100%;padding:15px;font-size:19px;font-weight:800;border:0;border-radius:14px;color:#fff;background:linear-gradient(120deg,#1f3a5f,#1f3a5f)">Rozumiem</button></div></div><script>(function(){var K='discAccepted_v1:'+document.title,d=document.getElementById('startDisc');var ok=false;try{ok=localStorage.getItem(K)==='1'}catch(e){}if(!ok&&window.parent===window)d.style.display='flex';document.getElementById('startDiscOk').onclick=function(){try{localStorage.setItem(K,'1')}catch(e){}d.style.display='none';};})();</script>
<header><h1>⚡ Stan padaczkowy SOR</h1><button id="tab" class="ib" title="Tabela dawek">📋</button><button id="info" class="ib">ℹ</button></header>
<div class="wrow"><label for="w">Masa ciała [kg]</label><input id="w" inputmode="decimal" placeholder="70"></div>
<div class="crow"><button class="tg" data-c="liver">wątroba</button><button class="tg" data-c="renal">nerki</button><button class="tg" data-c="cardiac">serce</button><button class="tg" data-c="preg">ciąża</button><span class="zr">ZRM BZD <button id="zm">−</button><b id="zn">0</b><button id="zp">+</button></span></div>
<div class="crow c2" id="co2"><button class="tg2" data-c="alco">alkoholizm / niedożywienie / bariatria / wymioty</button><button class="tg2" data-c="wern">podejrzenie Wernickego</button><button class="tg2" data-c="polg">choroba mitochondrialna / POLG</button><button class="tg2" data-c="ucd">zaburzenia cyklu mocznikowego</button><button class="tg2" data-c="plt">PLT &lt;100 G/l / skaza</button><button class="tg2" data-c="carb">karbapenem (meropenem)</button><button class="tg2" data-c="resp">pogorszenie oddychania</button><label class="t0l">Początek napadu <input id="t0" type="time"></label></div>
<div id="stage3"></div><div id="second"></div><div id="thia"></div>
<div class="crow" id="crr" hidden><label>CLkr [ml/min]</label><input id="crcl" inputmode="decimal" class="sml"></div>
<div id="grid"></div>
<div id="res"></div>
<div id="infoBox" hidden></div>
<div class="disc">Narzędzie pomocnicze, niecertyfikowane. Każdą dawkę weryfikuje lekarz.</div>
<script src="../../calc/thiamine.js"></script><script src="engine.js"></script><script src="app.js"></script><script src="../../sexguard.js"></script></body></html>
